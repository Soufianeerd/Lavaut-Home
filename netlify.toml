[build]
  publish = "."

# Anciennes URL WordPress -> nouvelles ancres (conserve le référencement et les liens partagés)
[[redirects]]
  from = "/nos-services/*"
  to = "/#tarifs"
  status = 301
[[redirects]]
  from = "/reservation/*"
  to = "/#reserver"
  status = 301
[[redirects]]
  from = "/contact/*"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/a-propos/*"
  to = "/#realisations"
  status = 301
[[redirects]]
  from = "/mentions-legales/*"
  to = "/mentions-legales.html"
  status = 301
[[redirects]]
  from = "/2023/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-content/uploads/2024/02/C2614_5-2.mp4"
  to = "/assets/video/lavauthome-presentation-720p.mp4"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/*sitemap*.xml"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
